# fly.toml — `fly launch` then `fly deploy`
app = "midnight-game"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "get"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[env]
  PORT = "3000"
